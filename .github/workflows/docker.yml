# Build the container and publish it to GHCR (ARCHITECTURE.md §11).
name: container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  test:
    # The image is only worth building if the suite passes on the interpreter it pins,
    # so this runs the same 3.12 the Dockerfile uses rather than trusting the default.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[discord,llm,dev]'
      - run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to GHCR as GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v7

      # amd64 is the deployment target (§11's e2-micro); arm64 is so the image pulls
      # on an Apple Silicon machine. The runner is x86_64, so arm64 is cross-built.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # A pull request builds and is smoke-tested but publishes nothing: a fork must not
      # be able to push an image, and an unreviewed branch must not become :latest.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr

      # Loaded locally first so the smoke test runs against the exact image that will be
      # pushed, rather than a rebuild that might differ.
      # Native arch only: `load` cannot take a multi-platform result, and the runner
      # can only *run* its own architecture, which the smoke test below needs.
      - name: Build for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: gary:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A green suite runs from source, so it cannot catch a wheel that is missing a module
      # or its data. This imports the adapters from the installed image, checks the class
      # data shipped, and rolls one die through it.
      - name: Smoke-test the built image
        run: |
          docker run --rm --entrypoint python gary:ci -c "
          import gary.adapters.discord_bot
          from gary.sheets import CLASSES
          from gary.monsters import BESTIARY
          from gary.gear import EQUIPMENT
          from gary.class_moves import TEXTS
          from gary.ports import RandomDice
          assert len(CLASSES) == 8, f'class data missing: {sorted(CLASSES)}'
          assert len(BESTIARY) == 154, f'monster data missing: {len(BESTIARY)}'
          assert len(EQUIPMENT) == 45, f'equipment data missing: {len(EQUIPMENT)}'
          assert len(TEXTS) == 8, f'class move data missing: {sorted(TEXTS)}'
          roll = RandomDice().roll('2d6')
          assert 2 <= roll.total <= 12, roll
          print('ok: adapters import, 8 classes, 154 monsters, 45 items, dice roll', roll.render())
          "
          # Config validation must fail fast and by name, not hang holding a token.
          docker run --rm gary:ci 2>&1 | grep -q 'DISCORD_TOKEN is empty'
          docker run --rm --entrypoint id gary:ci | grep -q 'uid=10001'

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
