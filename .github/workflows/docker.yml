# Build the container and publish it to GHCR (ARCHITECTURE.md §11).
name: container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  test:
    # The image is only worth building if the suite passes on the interpreter it pins,
    # so this runs the same 3.12 the Dockerfile uses rather than trusting the default.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[discord,llm,dev]'
      - run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to GHCR as GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v7

      # amd64 is the deployment target (§11's e2-micro); arm64 is so the image pulls
      # on an Apple Silicon machine. The runner is x86_64, so arm64 is cross-built.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # A pull request builds and is smoke-tested but publishes nothing: a fork must not
      # be able to push an image, and an unreviewed branch must not become :latest.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr

      # Loaded locally first so the smoke test runs against the exact image that will be
      # pushed, rather than a rebuild that might differ.
      # Native arch only: `load` cannot take a multi-platform result, and the runner
      # can only *run* its own architecture, which the smoke test below needs.
      - name: Build for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: gary:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The failure this catches is silent: without [tool.setuptools.package-data] the
      # wheel carries no data/*.json, every creature reads as homebrew, and the encounter
      # benchmark and morale (§5.4) go quiet instead of erroring. A green suite does not
      # catch it, because the suite runs from source where the files are always there.
      - name: Smoke-test the built image
        run: |
          docker run --rm --entrypoint python gary:ci -c "
          import sys
          from gary.encounters import lookup, MONSTERS
          from gary.templates import condition
          assert len(MONSTERS) > 300, f'SRD monsters missing: {len(MONSTERS)}'
          assert lookup('Bandit'), 'lookup failed'
          assert condition('prone'), 'SRD conditions missing'
          print(f'ok: {len(MONSTERS)} monsters, conditions present')
          "
          # Config validation must fail fast and by name, not hang holding a token.
          docker run --rm gary:ci 2>&1 | grep -q 'DISCORD_TOKEN is empty'
          docker run --rm --entrypoint id gary:ci | grep -q 'uid=10001'

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
