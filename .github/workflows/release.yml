# Cut a release: a date version, tagged, with a GitHub Release and a versioned image.
# See RELEASING.md for the scheme: YYYY.M.D, plus .N for a second release the same day.
name: release

on:
  # The usual way: Actions -> release -> Run workflow.
  workflow_dispatch:
    inputs:
      breaking:
        description: "Does this break a running campaign? (saved state, a slash command, a VM setting)"
        type: boolean
        default: false
      breaking_notes:
        description: "If so: what changes, and what to do before deploying"
        type: string
        default: ""
  # Or tag by hand (git tag v2026.11.4 && git push origin v2026.11.4): the tag must match pyproject.toml.
  push:
    tags: ["v*"]

permissions:
  contents: write   # commit the version, push the tag, create the release
  actions: write    # start the image build for the new tag

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # every tag, for the notes and the same-day count

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # Never release a red build.
      - run: pip install -e '.[discord,llm,dev]'
      - run: pytest -q

      - name: Work out the version
        id: version
        run: |
          current=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Today in UTC, unpadded: Python's packaging rewrites 2026.11.04 as 2026.11.4, and the tag
            # must match what Gary reports.
            next=$(TZ=UTC date +%Y.%-m.%-d)
            if git rev-parse "v${next}" >/dev/null 2>&1; then
              n=1
              while git rev-parse "v${next}.${n}" >/dev/null 2>&1; do n=$((n + 1)); done
              next="${next}.${n}"
            fi
          else
            next="${GITHUB_REF_NAME#v}"
            if [ "$next" != "$current" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} doesn't match pyproject.toml's version ${current}."
              exit 1
            fi
          fi
          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "tag=v${next}" >> "$GITHUB_OUTPUT"

      - name: Set the version, commit and tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          python - <<'EOF'
          import re, pathlib
          p = pathlib.Path("pyproject.toml")
          p.write_text(re.sub(r'(?m)^version = "[^"]+"', 'version = "${{ steps.version.outputs.version }}"', p.read_text(), count=1))
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release ${{ steps.version.outputs.tag }}"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Gary ${{ steps.version.outputs.tag }}"
          git push origin HEAD:main "${{ steps.version.outputs.tag }}"

      # Notes generated from the commits since the last release; a breaking change gets a warning on top.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          BREAKING: ${{ inputs.breaking }}
          BREAKING_NOTES: ${{ inputs.breaking_notes }}
        run: |
          notes=""
          if [ "$BREAKING" = "true" ]; then
            notes=$(printf '## ⚠ Breaking\n\n%s\n' "${BREAKING_NOTES:-This release changes something a running campaign depends on. Read the changes before deploying.}")
          fi
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "Gary ${{ steps.version.outputs.tag }}" \
            --notes "$notes" --generate-notes --verify-tag

      # A tag pushed by this workflow's token starts no other workflow, so the image build for it is
      # started here. (A tag pushed by hand already started it.)
      - name: Build the versioned image
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docker.yml --ref "${{ steps.version.outputs.tag }}"
