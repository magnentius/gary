# Cut a release: bump the version, tag it, publish the GitHub Release and the versioned image.
# See RELEASING.md for the scheme (semantic versioning, vMAJOR.MINOR.PATCH).
name: release

on:
  # The usual way: Actions -> release -> Run workflow, and choose the bump.
  workflow_dispatch:
    inputs:
      bump:
        description: "patch = fixes · minor = new features or rules · major = breaks a running campaign"
        type: choice
        options: [patch, minor, major]
        default: minor
  # Or tag by hand (git tag v1.2.3 && git push origin v1.2.3): the tag must match pyproject.toml.
  push:
    tags: ["v*"]

permissions:
  contents: write   # commit the bump, push the tag, create the release
  actions: write    # start the image build for the new tag

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # every tag, for the release notes and the bump

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # Never release a red build.
      - run: pip install -e '.[discord,llm,dev]'
      - run: pytest -q

      - name: Work out the version
        id: version
        run: |
          current=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            IFS=. read -r major minor patch <<< "$current"
            case "${{ inputs.bump }}" in
              major) next="$((major + 1)).0.0" ;;
              minor) next="${major}.$((minor + 1)).0" ;;
              patch) next="${major}.${minor}.$((patch + 1))" ;;
            esac
          else
            next="${GITHUB_REF_NAME#v}"
            if [ "$next" != "$current" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} doesn't match pyproject.toml's version ${current}."
              exit 1
            fi
          fi
          if git rev-parse "v${next}" >/dev/null 2>&1 && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::v${next} already exists."
            exit 1
          fi
          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "tag=v${next}" >> "$GITHUB_OUTPUT"

      - name: Bump, commit and tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          python - <<'EOF'
          import re, pathlib
          p = pathlib.Path("pyproject.toml")
          p.write_text(re.sub(r'(?m)^version = "[^"]+"', 'version = "${{ steps.version.outputs.version }}"', p.read_text(), count=1))
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release ${{ steps.version.outputs.tag }}"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Gary ${{ steps.version.outputs.tag }}"
          git push origin HEAD:main "${{ steps.version.outputs.tag }}"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "Gary ${{ steps.version.outputs.tag }}" \
            --generate-notes --verify-tag

      # A tag pushed by this workflow's token starts no other workflow, so the image build for it is
      # started here. (A tag pushed by hand already started it.)
      - name: Build the versioned image
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docker.yml --ref "${{ steps.version.outputs.tag }}"
