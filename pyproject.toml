[project]
name = "gary"
version = "2026.11.4"
description = "AI Game Master: Gemini narrative, Gary-rolled dice and persistent campaign state, over Discord."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = []

[project.optional-dependencies]
# The deterministic core (src/gary, minus the discord/ and llm/ adapters) has no
# third-party dependencies by design, so it can be tested without a Discord server
# or an API key. Adapters are additive.
discord = ["discord.py>=2.4"]
llm = ["google-genai>=1.0"]
gcp = ["google-cloud-firestore>=2.16"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=77"]  # license = "MIT" (PEP 639)
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The class data is part of the package, not a development convenience. Without this a
# non-editable install (which is what a container is) ships no data/*.json, and the
# first `?dm new` fails instead of the build.
[tool.setuptools.package-data]
gary = ["data/*.json", "data/*.jpg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
