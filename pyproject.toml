[project]
name = "gary"
version = "0.1.0"
description = "AI Game Master: Gemini narrative + Avrae rules + persistent campaign state, over Discord."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# The deterministic core (src/gary, minus the discord/ and llm/ adapters) has no
# third-party dependencies by design, so it can be tested without a Discord server
# or an API key. Adapters are additive.
discord = ["discord.py>=2.4"]
llm = ["google-genai>=1.0"]
gcp = ["google-cloud-firestore>=2.16"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "d20>=1.1",   # reproduces Avrae's roll strings
    "pypdf>=5.0", # scripts/extract_srd_*.py read the SRD PDF
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The SRD data is part of the package, not a development convenience. Without this a
# non-editable install (which is what a container is) ships no data/*.json at all, and
# both loaders below degrade to empty in silence: every creature reads as homebrew, the
# encounter benchmark stops recognising anything, and morale never fires.
[tool.setuptools.package-data]
gary = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
