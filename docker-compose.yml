# Pull the published image and run it against a campaign directory on this machine.
#
#   cp .env.example .env    # then fill in the token and channel id
#   docker compose up -d
#   docker compose logs -f
#
# To run a local build instead of the published image, uncomment `build: .` below.

services:
  gary:
    image: ghcr.io/magnentius/gary:latest
    # build: .
    container_name: gary
    # Outside the checkout, for the same reason the campaign is: deleting a clone must
    # not take your token with it. $XDG_CONFIG_HOME is honoured where it is set.
    env_file: ${XDG_CONFIG_HOME:-~/.config}/gary/env

    # The campaign lives on the host, not in the container. Without this a restart
    # loses the journal, the snapshots and every channel's history, and §7.3 has no
    # undo for that. GARY_CAMPAIGN_ROOT is /campaign inside the image.
    #
    # Outside the repo on purpose: `rm -rf gary && git clone ...` is an ordinary thing
    # to do to a checkout, and it must not be able to take the campaign with it.
    #
    # A fixed path rather than ${GARY_HOST_CAMPAIGN}, deliberately: `env_file` does not
    # feed compose's own interpolation -- only the project-directory .env or an explicit
    # --env-file does -- so once the env file moved out of the repo, a variable here
    # would have silently fallen back to this default and mounted the wrong campaign
    # with no error. To run a second campaign, use a docker-compose.override.yml.
    volumes:
      - ~/.local/share/gary/campaign:/campaign

    # Gary holds a Discord Gateway WebSocket and must simply stay up; there is no
    # request to fail. This is the container equivalent of §11's `Restart=always`.
    restart: unless-stopped
    stop_grace_period: 30s

    # tini as PID 1: reaps zombies, and forwards signals with normal semantics rather
    # than PID 1's, where anything without an explicit handler is discarded. Gary now
    # handles SIGTERM itself, so this is belt to that braces -- but it is what makes a
    # missing handler slow rather than silently fatal.
    init: true

    # One writer per campaign (§7.6). The lock is flock and therefore per-machine, so
    # it cannot stop a second Gary running on a different host against the same
    # Firestore campaign -- do not scale this service.
    deploy:
      replicas: 1

    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
